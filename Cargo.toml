[package]
name = "pimalaya-stream"
description = "Blocking stream and TLS utils for Pimalaya"
version = "0.3.0"
authors = ["Clément DOUIN (soywod) <pimalaya.org@posteo.net>"]
rust-version = "1.89"
edition = "2024"
license = "MIT OR Apache-2.0"
categories = ["api-bindings", "network-programming"]
keywords = ["pimalaya", "stream", "tls", "tcp", "proxy"]
homepage = "https://pimalaya.org"
documentation = "https://docs.rs/pimalaya-stream/latest/pimalaya_stream"
repository = "https://github.com/pimalaya/stream"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["rustls-ring"]
std = ["dep:uds_windows", "dep:io-proxy"]
native-tls = ["std", "dep:native-tls"]
rustls-aws = ["std", "dep:rustls", "dep:rustls-platform-verifier", "rustls/aws-lc-rs"]
rustls-ring = ["std", "dep:rustls", "dep:rustls-platform-verifier", "rustls/ring"]
vendored = ["native-tls?/vendored"]

[[example]]
name = "tls"
path = "examples/tls.rs"
required-features = ["std"]

[[example]]
name = "starttls"
path = "examples/starttls.rs"
required-features = ["std"]

[[example]]
name = "proxy"
path = "examples/proxy.rs"
required-features = ["std"]

[dev-dependencies]
env_logger = "0.11"

[dependencies]
anyhow = { version = "1", default-features = false, features = ["std"] }
io-proxy = { version = "0.1", optional = true, default-features = false, features = ["socks5", "http", "client"] }
log = { version = "0.4", default-features = false }
native-tls = { version = "0.2", default-features = false, optional = true }
rustls = { version = "0.23", default-features = false, features = ["logging", "std", "tls12"], optional = true }
rustls-platform-verifier = { version = "0.7", default-features = false, optional = true }
secrecy = { version = "0.10", default-features = false }
url = { version = "2.2", default-features = false }

[target.'cfg(windows)'.dependencies]
uds_windows = { version = "1", optional = true }
